# Substrate ActorTemplate resource (protojson-shaped ateapipb.ActorTemplate,
# NOT the ate.dev/v1alpha1 CRD) for the manual micro-VM CSI test; the pool
# lives in counter-microvm-csi-test.yaml, which documents the apply steps.
#
# Caveat: the proto documents externalVolumeTemplate as not supported with
# SANDBOX_CLASS_MICROVM, and nothing in the control plane rejects the
# combination — this manifest exists precisely to exercise where it stands.

metadata:
  atespace: ate-demo-counter-microvm-csi
  name: counter-microvm-csi
workerSelector:
  matchLabels:
    workload: counter-microvm-csi
containers:
- name: counter
  image: ko://github.com/agent-substrate/substrate/demos/counter
  readyz:
    httpGet:
      path: /readyz
      port: 80
  volumeMounts:
  - name: data
    mountPath: /home/counter
snapshotsConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_DATA
  onResume:
    fromData: RESUME_SOURCE_GOLDEN
  storageLocation: gs://ate-snapshots/ate-demo-counter-microvm-csi/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_MICROVM
  configName: microvm
volumes:
- name: data
  type: ExternalVolumeTemplate
  externalVolumeTemplate:
    capacity: 1Gi
    storageClassName: csi-hostpath-sc
