# Manual manifest for exercising the CSI external-volume path on a micro-VM
# pool (kind + hack/setup-csi-hostpath-kind.sh). Apply this pool with
# `ko apply -f -`, then create the template from
# counter-microvm-csi-test-template.yaml:
#
#   kubectl ate create atespace ate-demo-counter-microvm-csi
#   ko resolve -f demos/counter/counter-microvm-csi-test-template.yaml \
#     | kubectl ate create actor-template -f -

apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-counter-microvm-csi

---

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: counter-microvm-csi
  namespace: ate-demo-counter-microvm-csi
  labels:
    workload: counter-microvm-csi
spec:
  replicas: 1
  sandboxClass: microvm
  sandboxConfigName: microvm
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-microvm
