# Substrate ActorTemplate resource (protojson-shaped ateapipb.ActorTemplate,
# NOT the ate.dev/v1alpha1 CRD) for the manual multi-volume test; the pool
# lives in manual-test-multi.yaml, which documents the apply steps.

metadata:
  atespace: ate-manual-test-multi
  name: sandbox-template
workerSelector:
  matchLabels:
    workload: sandbox
containers:
- name: sandbox
  image: ko://github.com/agent-substrate/substrate/demos/sandbox
  command: ["/ko-app/sandbox"]
  env:
  - name: PORT
    value: "80"
  volumeMounts:
  - name: vol-hostpath
    mountPath: /hostpath-data
  - name: vol-nfs
    mountPath: /nfs-data
snapshotsConfig:
  storageLocation: gs://ate-snapshots/ate-manual-test-multi/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
volumes:
- name: vol-hostpath
  type: ExternalVolumeTemplate
  externalVolumeTemplate:
    capacity: 1Gi
    storageClassName: csi-hostpath-sc
- name: vol-nfs
  type: ExternalVolumeTemplate
  externalVolumeTemplate:
    capacity: 1Gi
    storageClassName: csi-nfs-sc
