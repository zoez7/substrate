# Manual manifest for exercising multiple external volumes (hostpath + NFS
# CSI). Apply this pool with `ko apply -f -`, then create the template from
# manual-test-multi-template.yaml:
#
#   kubectl ate create atespace ate-manual-test-multi
#   ko resolve -f demos/sandbox/manual-test-multi-template.yaml \
#     | kubectl ate create actor-template -f -

apiVersion: v1
kind: Namespace
metadata:
  name: ate-manual-test-multi
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: sandbox-pool
  namespace: ate-manual-test-multi
  labels:
    workload: sandbox
spec:
  replicas: 1
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
